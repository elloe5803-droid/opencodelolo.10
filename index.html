<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#0d0d0d"
  >

  <title>OpenCode Web</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0d0d0d;
      color: #e7e7e7;
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    button,
    textarea,
    input {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    .app {
      display: flex;
      width: 100%;
      height: 100dvh;
      background: #0d0d0d;
    }

    /* =========================
       SIDEBAR
    ========================= */

    .sidebar {
      width: 270px;
      height: 100%;
      flex-shrink: 0;
      background: #111111;
      border-right: 1px solid #252525;
      display: flex;
      flex-direction: column;
      transition: transform .25s ease;
      z-index: 50;
    }

    .sidebar-header {
      height: 60px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #242424;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #fff;
      font-weight: 700;
      letter-spacing: -.2px;
    }

    .brand-mark {
      width: 26px;
      height: 26px;
      border-radius: 7px;
      background: #f1f1f1;
      color: #111;
      display: grid;
      place-items: center;
      font-size: 14px;
      font-weight: 800;
    }

    .close-sidebar {
      display: none;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: transparent;
      color: #aaa;
    }

    .sidebar-content {
      flex: 1;
      overflow-y: auto;
      padding: 14px 10px;
    }

    .new-session {
      width: 100%;
      height: 42px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 12px;
      border-radius: 9px;
      background: #1d1d1d;
      color: #eee;
      text-align: left;
      border: 1px solid #2a2a2a;
      margin-bottom: 22px;
    }

    .new-session:hover {
      background: #252525;
    }

    .section-title {
      padding: 0 9px;
      margin: 18px 0 8px;
      color: #777;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    #sessions {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .session {
      width: 100%;
      min-height: 38px;
      padding: 8px 10px;
      border-radius: 7px;
      background: transparent;
      color: #a9a9a9;
      text-align: left;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .session:hover {
      background: #1a1a1a;
      color: #eee;
    }

    .session.active {
      background: #202020;
      color: #fff;
    }

    .sidebar-footer {
      padding: 10px;
      border-top: 1px solid #242424;
    }

    .footer-button {
      width: 100%;
      height: 38px;
      background: transparent;
      color: #888;
      border-radius: 7px;
      text-align: left;
      padding: 0 10px;
    }

    .footer-button:hover {
      background: #1b1b1b;
      color: #ddd;
    }

    /* =========================
       MAIN
    ========================= */

    .main {
      min-width: 0;
      flex: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      height: 60px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 18px;
      border-bottom: 1px solid #252525;
      background: #0d0d0d;
    }

    .menu-button {
      display: none;
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: transparent;
      color: #ccc;
      font-size: 20px;
    }

    .menu-button:hover {
      background: #1b1b1b;
    }

    .workspace {
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    .workspace-name {
      color: #eee;
      font-size: 14px;
      font-weight: 600;
    }

    .workspace-subtitle {
      color: #666;
      font-size: 11px;
      margin-top: 2px;
    }

    .top-actions {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .icon-button {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      background: transparent;
      color: #999;
      font-size: 17px;
    }

    .icon-button:hover {
      background: #1a1a1a;
      color: #eee;
    }

    /* =========================
       CHAT
    ========================= */

    .chat {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    #messages {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 30px max(18px, calc((100% - 850px) / 2));
      scroll-behavior: smooth;
    }

    .empty-state {
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      color: #666;
      padding: 20px;
    }

    .empty-logo {
      width: 46px;
      height: 46px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: #191919;
      color: #ddd;
      font-weight: 800;
      margin-bottom: 15px;
    }

    .empty-state h1 {
      color: #ddd;
      font-size: 20px;
      margin: 0 0 8px;
    }

    .empty-state p {
      max-width: 390px;
      margin: 0;
      font-size: 13px;
      line-height: 1.6;
    }

    .message {
      width: 100%;
      margin: 0 auto 26px;
      animation: appear .18s ease;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(3px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .message-label {
      margin-bottom: 7px;
      color: #777;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .06em;
    }

    .message-content {
      color: #dedede;
      font-size: 14px;
      line-height: 1.7;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .message.user {
      padding-left: 10px;
      border-left: 2px solid #3a3a3a;
    }

    .message.assistant {
      padding: 14px 16px;
      border: 1px solid #252525;
      border-radius: 10px;
      background: #111;
    }

    .message.assistant .message-label {
      color: #999;
    }

    /* =========================
       COMPOSER
    ========================= */

    .composer-area {
      flex-shrink: 0;
      padding:
        10px
        max(12px, calc((100% - 850px) / 2))
        calc(12px + env(safe-area-inset-bottom));
      background: linear-gradient(
        to top,
        #0d0d0d 70%,
        rgba(13,13,13,0)
      );
    }

    .composer {
      position: relative;
      display: flex;
      align-items: flex-end;
      gap: 8px;
      min-height: 58px;
      padding: 8px;
      border: 1px solid #303030;
      border-radius: 12px;
      background: #151515;
      box-shadow: 0 8px 30px rgba(0,0,0,.2);
    }

    .composer-left {
      display: flex;
      align-items: center;
      align-self: flex-end;
    }

    .attach-button {
      width: 38px;
      height: 38px;
      border-radius: 8px;
      background: transparent;
      color: #888;
      font-size: 20px;
    }

    .attach-button:hover {
      background: #222;
      color: #ddd;
    }

    #message {
      flex: 1;
      min-width: 0;
      min-height: 40px;
      max-height: 180px;
      resize: none;
      outline: none;
      border: 0;
      background: transparent;
      color: #eee;
      padding: 10px 4px;
      line-height: 1.5;
      font-size: 14px;
    }

    #message::placeholder {
      color: #666;
    }

    .send-button {
      width: 40px;
      height: 40px;
      flex-shrink: 0;
      border-radius: 9px;
      background: #e7e7e7;
      color: #111;
      font-size: 18px;
      font-weight: 800;
    }

    .send-button:hover {
      background: #fff;
    }

    .composer-hint {
      padding: 7px 4px 0;
      color: #555;
      font-size: 10px;
      text-align: center;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 760px) {
      .sidebar {
        position: fixed;
        left: 0;
        top: 0;
        bottom: 0;
        transform: translateX(-100%);
        width: min(82vw, 300px);
        box-shadow: 12px 0 35px rgba(0,0,0,.45);
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .close-sidebar {
        display: block;
      }

      .menu-button {
        display: block;
      }

      .topbar {
        height: 56px;
        padding: 0 10px;
      }

      .workspace-name {
        font-size: 13px;
      }

      .workspace-subtitle {
        display: none;
      }

      #messages {
        padding: 22px 14px;
      }

      .message {
        margin-bottom: 22px;
      }

      .message-content {
        font-size: 14px;
      }

      .composer-area {
        padding-left: 10px;
        padding-right: 10px;
      }

      .composer-hint {
        display: none;
      }

      .empty-state h1 {
        font-size: 18px;
      }
    }

    @media (min-width: 761px) {
      .main {
        min-width: 0;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <!-- SIDEBAR -->
    <aside class="sidebar">

      <div class="sidebar-header">
        <div class="brand">
          <div class="brand-mark">O</div>
          <span>OpenCode Web</span>
        </div>

        <button
          class="close-sidebar"
          onclick="toggleSidebar()"
          aria-label="Close menu"
        >
          ×
        </button>
      </div>

      <div class="sidebar-content">

        <button
          class="new-session"
          onclick="createSession()"
        >
          <span>＋</span>
          <span>New session</span>
        </button>

        <div class="section-title">
          Sessions
        </div>

        <div id="sessions"></div>

        <div class="section-title">
          Project
        </div>

        <button class="footer-button">
          ◇ Files
        </button>

        <button class="footer-button">
          >_ Terminal
        </button>

      </div>

      <div class="sidebar-footer">
        <button class="footer-button">
          ⚙ Settings
        </button>
      </div>

    </aside>

    <!-- MAIN -->
    <main class="main">

      <!-- TOP BAR -->
      <header class="topbar">

        <button
          class="menu-button"
          onclick="toggleSidebar()"
          aria-label="Open menu"
        >
          ☰
        </button>

        <div class="workspace">
          <div class="workspace-name">
            OpenCode
          </div>

          <div class="workspace-subtitle">
            AI coding workspace
          </div>
        </div>

        <div class="top-actions">

          <button
            class="icon-button"
            title="Search"
          >
            ⌕
          </button>

          <button
            class="icon-button"
            title="More"
          >
            ⋮
          </button>

        </div>

      </header>

      <!-- CHAT -->
      <section class="chat">

        <div id="messages">

          <div class="empty-state">

            <div class="empty-logo">
              O
            </div>

            <h1>
              What do you want to build?
            </h1>

            <p>
              Ask the coding assistant to create,
              explain, debug, or improve your code.
            </p>

          </div>

        </div>

        <!-- COMPOSER -->
        <div class="composer-area">

          <form
            class="composer"
            onsubmit="sendMessage(event)"
          >

            <div class="composer-left">

              <button
                type="button"
                class="attach-button"
                title="Attach"
              >
                ＋
              </button>

            </div>

            <textarea
              id="message"
              name="message"
              rows="1"
              autocomplete="off"
              placeholder="Ask anything..."
              aria-label="Message"
            ></textarea>

            <button
              type="submit"
              class="send-button"
              title="Send"
              aria-label="Send message"
            >
              ↑
            </button>

          </form>

          <div class="composer-hint">
            Enter to send · Shift + Enter for new line
          </div>

        </div>

      </section>

    </main>

  </div>

  <script src="app.js"></script>

</body>
</html>
