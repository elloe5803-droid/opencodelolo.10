<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#0b0b0f">

  <link rel="manifest" href="manifest.json">

  <title>OpenCode Web</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #0b0b0f;
      color: #f5f5f7;
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    body {
      overflow: hidden;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      width: 100%;
      height: 100dvh;
      display: flex;
      overflow: hidden;
    }

    /* SIDEBAR */

    .sidebar {
      width: 250px;
      min-width: 250px;
      height: 100%;
      background: #111116;
      border-right: 1px solid #292932;
      padding: 16px;
      overflow-y: auto;
    }

    .brand {
      font-size: 20px;
      font-weight: 750;
      margin-bottom: 22px;
    }

    .new-session {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid #30303a;
      border-radius: 9px;
      background: #1a1a21;
      color: #fff;
      text-align: left;
    }

    .new-session:active {
      transform: scale(.98);
    }

    #sessions {
      margin-top: 12px;
    }

    .session {
      display: block;
      width: 100%;
      margin-bottom: 6px;
      padding: 11px;
      border: 0;
      border-radius: 9px;
      background: transparent;
      color: #aaaab4;
      text-align: left;
      font-size: 14px;
    }

    .session:hover,
    .session.active {
      background: #202027;
      color: #fff;
    }

    /* MAIN */

    .main {
      min-width: 0;
      flex: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    /* TOP BAR */

    .topbar {
      height: 58px;
      min-height: 58px;
      border-bottom: 1px solid #292932;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 16px;
      background: #0d0d12;
    }

    .top-title {
      font-weight: 700;
    }

    .status {
      font-size: 12px;
      color: #858591;
    }

    .menu-button {
      display: none;
      border: 1px solid #30303a;
      border-radius: 8px;
      background: #18181f;
      color: #fff;
      padding: 7px 10px;
    }

    /* WORKSPACE */

    .workspace {
      min-height: 0;
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    .editor {
      min-width: 0;
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    .content {
      width: 100%;
      max-width: 850px;
      margin: 0 auto;
    }

    .welcome {
      padding: 40px 0 20px;
    }

    .welcome h1 {
      margin: 0 0 8px;
      font-size: 30px;
    }

    .description {
      margin: 0;
      color: #9999a5;
    }

    /* CHAT MESSAGES */

    #messages {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 25px;
    }

    .message {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #292932;
      border-radius: 11px;
      background: #14141a;
    }

    .message.user {
      background: #1b1b22;
    }

    .message-label {
      margin-bottom: 6px;
      color: #9999a5;
      font-size: 12px;
      font-weight: 600;
    }

    .message-content {
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.55;
    }

    /* CODE */

    .code {
      margin-top: 25px;
      padding: 16px;
      overflow-x: auto;
      border: 1px solid #292932;
      border-radius: 10px;
      background: #101015;
      color: #d5d5dc;
      font: 13px/1.7
        ui-monospace,
        SFMono-Regular,
        Menlo,
        Monaco,
        Consolas,
        monospace;
    }

    /* TERMINAL */

    .terminal {
      width: 330px;
      min-width: 330px;
      height: 100%;
      padding: 14px;
      border-left: 1px solid #292932;
      background: #08080b;
      color: #c9c9d0;
      font: 13px/1.6
        ui-monospace,
        SFMono-Regular,
        Menlo,
        Monaco,
        Consolas,
        monospace;
    }

    .terminal-title {
      margin-bottom: 12px;
      color: #fff;
      font-weight: 700;
    }

    .terminal-ready {
      margin-top: 4px;
      color: #777782;
    }

    /* CHAT INPUT */

    .chat {
      width: 100%;
      min-height: 70px;
      padding: 12px;
      display: flex;
      gap: 8px;
      border-top: 1px solid #292932;
      background: #0d0d12;
    }

    #message {
      min-width: 0;
      flex: 1;
      height: 46px;
      padding: 0 14px;
      border: 1px solid #30303a;
      border-radius: 10px;
      outline: none;
      background: #18181f;
      color: #fff;
    }

    #message::placeholder {
      color: #777782;
    }

    #message:focus {
      border-color: #5c5c69;
    }

    .send-button {
      height: 46px;
      padding: 0 18px;
      border: 0;
      border-radius: 10px;
      background: #fff;
      color: #000;
      font-weight: 700;
    }

    .send-button:active {
      transform: scale(.97);
    }

    /* MOBILE */

    @media (max-width: 700px) {

      .sidebar {
        display: none;
        position: absolute;
        z-index: 100;
        left: 0;
        top: 0;
        width: 270px;
        min-width: 270px;
        box-shadow: 10px 0 40px rgba(0,0,0,.45);
      }

      .sidebar.open {
        display: block;
      }

      .menu-button {
        display: block;
      }

      .terminal {
        display: none;
      }

      .topbar {
        height: 54px;
        min-height: 54px;
        padding: 0 12px;
      }

      .editor {
        padding: 14px;
      }

      .welcome {
        padding-top: 25px;
      }

      .welcome h1 {
        font-size: 24px;
      }

      .chat {
        padding:
          9px
          9px
          calc(9px + env(safe-area-inset-bottom));
      }

      #message {
        height: 44px;
      }

      .send-button {
        height: 44px;
        padding: 0 14px;
      }

      .code {
        font-size: 12px;
      }
    }

    /* SMALL PHONE */

    @media (max-width: 390px) {

      .status {
        display: none;
      }

      .send-button {
        padding: 0 12px;
      }

      #message {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <!-- SIDEBAR -->

    <aside class="sidebar" id="sidebar">

      <div class="brand">
        OpenCode Web
      </div>

      <button
        class="new-session"
        onclick="createSession()"
      >
        ＋ New session
      </button>

      <div id="sessions"></div>

    </aside>

    <!-- MAIN -->

    <main class="main">

      <!-- TOP BAR -->

      <header class="topbar">

        <button
          class="menu-button"
          onclick="toggleSidebar()"
          aria-label="Menu"
        >
          ☰
        </button>

        <span class="top-title">
          OpenCode
        </span>

        <span class="status">
          Web · Mobile
        </span>

      </header>

      <!-- WORKSPACE -->

      <section class="workspace">

        <div class="editor">

          <div class="content">

            <div class="welcome">

              <h1>
                Build with AI
              </h1>

              <p class="description">
                Mobile AI coding workspace.
              </p>

            </div>

            <!-- AI MESSAGES -->

            <div id="messages"></div>

            <!-- PROJECT TREE -->

            <pre class="code">project/
├── src/
│   ├── index.ts
│   └── app.ts
├── package.json
└── README.md</pre>

          </div>

        </div>

        <!-- TERMINAL -->

        <aside class="terminal">

          <div class="terminal-title">
            Terminal
          </div>

          <div>
            $ workspace
          </div>

          <div class="terminal-ready">
            Ready.
          </div>

        </aside>

      </section>

      <!-- CHAT -->

      <form
        class="chat"
        onsubmit="sendMessage(event)"
      >

        <input
          id="message"
          type="text"
          autocomplete="off"
          placeholder="Ask AI to write code..."
        >

        <button
          class="send-button"
          type="submit"
        >
          Send
        </button>

      </form>

    </main>

  </div>

  <!-- APP LOGIC -->

  <script src="app.js"></script>

  <script>
    function toggleSidebar() {
      const sidebar =
        document.getElementById("sidebar");

      if (sidebar) {
        sidebar.classList.toggle("open");
      }
    }
  </script>

</body>
</html>
