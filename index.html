<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <meta
    name="theme-color"
    content="#09090b"
  />

  <title>OpenCode Lolo</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      background: #09090b;
      color: #fafafa;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    /* =========================
       APP
       ========================= */

    .app {
      display: grid;
      grid-template-columns: 250px 1fr;
      width: 100%;
      height: 100%;
      background: #09090b;
    }

    /* =========================
       SIDEBAR
       ========================= */

    .sidebar {
      display: flex;
      flex-direction: column;
      min-width: 0;
      border-right: 1px solid #27272a;
      background: #111113;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      height: 58px;
      padding: 0 15px;
      border-bottom: 1px solid #27272a;
    }

    .brand-logo {
      display: grid;
      place-items: center;
      width: 30px;
      height: 30px;
      border-radius: 8px;
      background: #fafafa;
      color: #09090b;
      font-size: 15px;
      font-weight: 800;
    }

    .brand-text {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .brand-title {
      font-size: 14px;
      font-weight: 700;
    }

    .brand-subtitle {
      color: #71717a;
      font-size: 11px;
    }

    .sidebar-content {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
    }

    .nav-section {
      margin-bottom: 18px;
    }

    .nav-label {
      padding: 7px 9px;
      color: #71717a;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .nav-button {
      display: flex;
      align-items: center;
      width: 100%;
      min-height: 38px;
      gap: 10px;
      padding: 8px 10px;
      margin: 2px 0;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: #a1a1aa;
      text-align: left;
      transition: .15s ease;
    }

    .nav-button:hover {
      background: #27272a;
      color: #fff;
    }

    .nav-button.active {
      background: #27272a;
      color: #fff;
    }

    .nav-icon {
      width: 20px;
      text-align: center;
      font-size: 15px;
    }

    .nav-text {
      flex: 1;
      font-size: 13px;
    }

    .sidebar-bottom {
      padding: 10px;
      border-top: 1px solid #27272a;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px;
      color: #a1a1aa;
      font-size: 11px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #71717a;
    }

    /* =========================
       MAIN
       ========================= */

    .main {
      display: flex;
      flex-direction: column;
      min-width: 0;
      height: 100%;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 58px;
      padding: 0 14px;
      border-bottom: 1px solid #27272a;
      background: #0f0f11;
    }

    .topbar-left,
    .topbar-right {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .mobile-menu {
      display: none;
    }

    .topbar-button {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border: 1px solid transparent;
      border-radius: 7px;
      background: transparent;
      color: #a1a1aa;
      font-size: 16px;
    }

    .topbar-button:hover {
      background: #27272a;
      color: #fff;
    }

    .chat-title {
      margin-left: 5px;
      color: #e4e4e7;
      font-size: 13px;
      font-weight: 600;
    }

    /* =========================
       CHAT
       ========================= */

    #messages {
      flex: 1;
      width: 100%;
      overflow-y: auto;
      padding: 30px 20px 160px;
    }

    .welcome {
      width: min(760px, 100%);
      margin: 10vh auto 0;
      text-align: center;
    }

    .welcome-logo {
      display: grid;
      place-items: center;
      width: 48px;
      height: 48px;
      margin: 0 auto 18px;
      border-radius: 14px;
      background: #fafafa;
      color: #09090b;
      font-size: 22px;
      font-weight: 800;
    }

    .welcome h1 {
      margin: 0 0 8px;
      font-size: 27px;
      letter-spacing: -.03em;
    }

    .welcome p {
      margin: 0;
      color: #71717a;
      font-size: 14px;
    }

    .suggestions {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-top: 28px;
    }

    .suggestion {
      padding: 13px;
      border: 1px solid #27272a;
      border-radius: 9px;
      background: #111113;
      color: #a1a1aa;
      text-align: left;
      font-size: 12px;
      transition: .15s ease;
    }

    .suggestion:hover {
      border-color: #52525b;
      background: #18181b;
      color: #fff;
    }

    /* =========================
       MESSAGE
       ========================= */

    .message {
      width: min(850px, 100%);
      margin: 0 auto 20px;
    }

    .message-role {
      margin-bottom: 6px;
      color: #71717a;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .06em;
    }

    .message-content {
      padding: 13px 15px;
      border: 1px solid #27272a;
      border-radius: 10px;
      background: #111113;
      color: #e4e4e7;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: 14px;
      line-height: 1.65;
    }

    .user-message .message-content {
      background: #18181b;
    }

    /* =========================
       COMPOSER
       ========================= */

    .composer-wrap {
      position: absolute;
      right: 0;
      bottom: 0;
      left: 250px;
      padding: 15px 20px 20px;
      background:
        linear-gradient(
          to bottom,
          transparent,
          #09090b 25%
        );
      pointer-events: none;
    }

    .composer {
      width: min(850px, 100%);
      margin: 0 auto;
      pointer-events: auto;
    }

    .composer-box {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      padding: 8px;
      border: 1px solid #3f3f46;
      border-radius: 12px;
      background: #18181b;
      box-shadow:
        0 12px 40px rgba(0, 0, 0, .25);
    }

    #message-input {
      flex: 1;
      min-width: 0;
      max-height: 180px;
      min-height: 44px;
      padding: 11px 8px;
      border: 0;
      outline: 0;
      resize: none;
      background: transparent;
      color: #fafafa;
      font-size: 14px;
      line-height: 1.5;
    }

    #message-input::placeholder {
      color: #71717a;
    }

    .composer-button {
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      flex-shrink: 0;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: #a1a1aa;
      font-size: 17px;
    }

    .composer-button:hover {
      background: #27272a;
      color: #fff;
    }

    #send-button {
      background: #fafafa;
      color: #09090b;
    }

    #send-button:hover {
      background: #e4e4e7;
    }

    .composer-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 3px 0;
      color: #52525b;
      font-size: 10px;
    }

    /* =========================
       LIGHT MODE
       ========================= */

    body.lolo-light,
    body.lolo-light .app {
      background: #fafafa;
      color: #18181b;
    }

    body.lolo-light .sidebar,
    body.lolo-light .topbar {
      background: #fff;
      border-color: #e4e4e7;
    }

    body.lolo-light .nav-button {
      color: #52525b;
    }

    body.lolo-light .nav-button:hover,
    body.lolo-light .nav-button.active {
      background: #f4f4f5;
      color: #18181b;
    }

    body.lolo-light #messages {
      background: #fafafa;
    }

    body.lolo-light .message-content,
    body.lolo-light .composer-box {
      background: #fff;
      border-color: #d4d4d8;
      color: #18181b;
    }

    body.lolo-light .composer-wrap {
      background:
        linear-gradient(
          to bottom,
          transparent,
          #fafafa 25%
        );
    }

    body.lolo-light #message-input {
      color: #18181b;
    }

    body.lolo-light .suggestion {
      background: #fff;
      border-color: #e4e4e7;
      color: #52525b;
    }

    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 760px) {
      .app {
        grid-template-columns: 1fr;
      }

      .sidebar {
        position: fixed;
        top: 0;
        bottom: 0;
        left: -280px;
        z-index: 5000;
        width: 270px;
        transition: left .2s ease;
        box-shadow: 15px 0 40px rgba(0, 0, 0, .35);
      }

      body.sidebar-open .sidebar {
        left: 0;
      }

      .mobile-menu {
        display: grid;
      }

      .composer-wrap {
        left: 0;
        padding: 10px 10px 12px;
      }

      #messages {
        padding: 20px 12px 140px;
      }

      .welcome {
        margin-top: 8vh;
      }

      .welcome h1 {
        font-size: 23px;
      }

      .suggestions {
        grid-template-columns: 1fr;
      }

      .chat-title {
        max-width: 150px;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
    }

    @media (max-width: 420px) {
      .topbar {
        padding: 0 8px;
      }

      .topbar-right .hide-mobile {
        display: none;
      }

      .composer-footer {
        display: none;
      }
    }
  </style>
</head>

<body class="lolo-dark">

  <div class="app">

    <!-- =====================
         SIDEBAR
         ===================== -->

    <aside class="sidebar">

      <div class="brand">
        <div class="brand-logo">
          O
        </div>

        <div class="brand-text">
          <div class="brand-title">
            OpenCode Lolo
          </div>

          <div class="brand-subtitle">
            AI Coding Workspace
          </div>
        </div>
      </div>

      <div class="sidebar-content">

        <div class="nav-section">

          <div class="nav-label">
            Workspace
          </div>

          <button
            class="nav-button active"
            type="button"
            data-action="new-chat"
          >
            <span class="nav-icon">＋</span>
            <span class="nav-text">
              New Chat
            </span>
          </button>

          <button
            class="nav-button"
            type="button"
            data-action="history"
          >
            <span class="nav-icon">◷</span>
            <span class="nav-text">
              History
            </span>
          </button>

          <button
            class="nav-button"
            type="button"
            data-action="search"
          >
            <span class="nav-icon">⌕</span>
            <span class="nav-text">
              Search
            </span>
          </button>

        </div>

        <div class="nav-section">

          <div class="nav-label">
            Project
          </div>

          <button
            class="nav-button"
            type="button"
            data-action="files"
          >
            <span class="nav-icon">▱</span>
            <span class="nav-text">
              Files
            </span>
          </button>

          <button
            class="nav-button"
            type="button"
            data-action="terminal"
          >
            <span class="nav-icon">⌘</span>
            <span class="nav-text">
              Terminal
            </span>
          </button>

          <button
            class="nav-button"
            type="button"
            data-action="upload"
          >
            <span class="nav-icon">↑</span>
            <span class="nav-text">
              Upload
            </span>
          </button>

        </div>

        <div class="nav-section">

          <div class="nav-label">
            Configuration
          </div>

          <button
            class="nav-button"
            type="button"
            data-action="settings"
          >
            <span class="nav-icon">⚙</span>
            <span class="nav-text">
              Settings
            </span>
          </button>

        </div>

      </div>

      <div class="sidebar-bottom">

        <div class="status">
          <span class="status-dot"></span>

          <span>
            Browser workspace
          </span>
        </div>

      </div>

    </aside>

    <!-- =====================
         MAIN
         ===================== -->

    <main class="main">

      <header class="topbar">

        <div class="topbar-left">

          <button
            class="topbar-button mobile-menu"
            type="button"
            id="mobile-menu-button"
            aria-label="Menu"
          >
            ☰
          </button>

          <button
            class="topbar-button"
            type="button"
            data-action="new-chat"
            title="New chat"
          >
            ＋
          </button>

          <div
            class="chat-title"
            id="chat-title"
          >
            New Chat
          </div>

        </div>

        <div class="topbar-right">

          <button
            class="topbar-button hide-mobile"
            type="button"
            data-action="search"
            title="Search"
          >
            ⌕
          </button>

          <button
            class="topbar-button"
            type="button"
            data-action="settings"
            title="Settings"
          >
            ⚙
          </button>

        </div>

      </header>

      <!-- =====================
           CHAT MESSAGES
           ===================== -->

      <section id="messages">

        <div
          class="welcome"
          id="welcome"
        >

          <div class="welcome-logo">
            O
          </div>

          <h1>
            What are you building?
          </h1>

          <p>
            Build, debug and explore your project
            with OpenCode Lolo.
          </p>

          <div class="suggestions">

            <button
              class="suggestion"
              type="button"
              data-suggestion="Build a modern responsive website for me."
            >
              Build a website
            </button>

            <button
              class="suggestion"
              type="button"
              data-suggestion="Help me debug my code."
            >
              Debug my code
            </button>

            <button
              class="suggestion"
              type="button"
              data-suggestion="Explain this code step by step."
            >
              Explain code
            </button>

            <button
              class="suggestion"
              type="button"
              data-suggestion="Create a complete application architecture for my project."
            >
              Design an app
            </button>

          </div>

        </div>

      </section>

    </main>

    <!-- =====================
         COMPOSER
         ===================== -->

    <div class="composer-wrap">

      <div class="composer">

        <div class="composer-box">

          <button
            class="composer-button"
            type="button"
            data-action="upload"
            title="Upload file"
          >
            ＋
          </button>

          <textarea
            id="message-input"
            name="message"
            rows="1"
            placeholder="Ask anything about your code..."
            autocomplete="off"
            spellcheck="false"
          ></textarea>

          <button
            class="composer-button"
            id="send-button"
            type="button"
            data-action="send"
            title="Send"
          >
            ↑
          </button>

        </div>

        <div class="composer-footer">

          <span>
            AI responses may contain mistakes.
          </span>

          <span>
            Enter to send · Shift + Enter for new line
          </span>

        </div>

      </div>

    </div>

  </div>

  <!-- =====================
       APP SCRIPT
       ===================== -->

  <script src="./app.js"></script>

  <script>
    /* =========================================
       UI helpers for this index.html
       ========================================= */

    const messageInput =
      document.getElementById("message-input");

    const welcome =
      document.getElementById("welcome");

    const mobileMenuButton =
      document.getElementById(
        "mobile-menu-button"
      );

    /*
      Mobile sidebar
    */

    mobileMenuButton?.addEventListener(
      "click",
      () => {
        document.body.classList.toggle(
          "sidebar-open"
        );
      }
    );

    /*
      Close mobile sidebar after
      clicking navigation.
    */

    document
      .querySelectorAll(
        ".sidebar [data-action]"
      )
      .forEach((button) => {
        button.addEventListener(
          "click",
          () => {
            document.body.classList.remove(
              "sidebar-open"
            );
          }
        );
      });

    /*
      Suggestion buttons
    */

    document
      .querySelectorAll(
        "[data-suggestion]"
      )
      .forEach((button) => {
        button.addEventListener(
          "click",
          () => {
            messageInput.value =
              button.dataset.suggestion;

            messageInput.focus();

            messageInput.dispatchEvent(
              new Event("input")
            );
          }
        );
      });

    /*
      Auto resize textarea
    */

    messageInput?.addEventListener(
      "input",
      () => {
        messageInput.style.height =
          "auto";

        messageInput.style.height =
          Math.min(
            messageInput.scrollHeight,
            180
          ) + "px";

        if (welcome) {
          welcome.style.display =
            messageInput.value.trim()
              ? "none"
              : "";
        }
      }
    );

    /*
      Ctrl/Cmd + K = search
    */

    document.addEventListener(
      "keydown",
      (event) => {
        if (
          (event.ctrlKey ||
            event.metaKey) &&
          event.key.toLowerCase() === "k"
        ) {
          event.preventDefault();

          window.OpenCodeLolo?.showSearch?.();
        }
      }
    );

    /*
      Ctrl/Cmd + Shift + P = settings
    */

    document.addEventListener(
      "keydown",
      (event) => {
        if (
          (event.ctrlKey ||
            event.metaKey) &&
          event.shiftKey &&
          event.key.toLowerCase() === "p"
        ) {
          event.preventDefault();

          window.OpenCodeLolo?.showSettings?.();
        }
      }
    );
  </script>

</body>
</html>
